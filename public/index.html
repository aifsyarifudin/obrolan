<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Chat WA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #e5ddd5; display: flex; justify-content: center; height: 100vh; }
        
        #chat-container {
            display: flex; width: 100%; max-width: 900px; height: 100vh;
            background: #efeae2; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative;
        }

        /* Sisi Kenca: Daptar Kontak/Jalma */
        #sidebar {
            width: 30%; background: white; border-right: 1px solid #ddd;
            display: flex; flex-direction: column;
        }
        .sidebar-header { background: #008069; color: white; padding: 15px; font-weight: bold; font-size: 15px; }
        #user-list { list-style: none; overflow-y: auto; flex: 1; }
        #user-list li {
            padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer;
            font-weight: 500; font-size: 14px; color: #333; transition: 0.2s;
        }
        #user-list li:hover { background: #f0f2f5; }
        #user-list li.active-chat { background: #d9fdd3; color: #008069; font-weight: bold; }

        /* Sisi Katuhu: Room Chat */
        #main-chat { width: 70%; display: flex; flex-direction: column; height: 100%; }
        .header { background-color: #008069; color: white; padding: 15px; font-size: 16px; font-weight: bold; }
        
        /* Tampilan Kotak Login */
        #login-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(239, 234, 226, 0.98); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
        }
        #login-input { padding: 12px; width: 80%; max-width: 300px; border: 1px solid #ccc; border-radius: 20px; margin-bottom: 15px; text-align: center; font-size: 16px; outline: none; }
        #login-btn { background: #008069; color: white; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        #messages { list-style-type: none; flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        #messages li { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 15px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-message { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .other-message { background-color: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .sender-id { font-size: 11px; font-weight: bold; color: #128c7e; margin-bottom: 2px; }

        #form { background: #f0f2f5; padding: 10px; display: flex; gap: 10px; align-items: center; }
        #input { border: none; padding: 12px; flex: 1; border-radius: 20px; outline: none; font-size: 15px; background: white; }
        #form button { background: #008069; color: white; border: none; padding: 12px 20px; border-radius: 50%; cursor: pointer; }

        /* Responsif kanggo HP */
        @media (max-width: 600px) {
            #sidebar { width: 35%; font-size: 12px; }
            #main-chat { width: 65%; }
            #user-list li { padding: 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="login-area">
            <h3 style="color: #008069; margin-bottom: 15px;">Lebetkeun ID / Nami Akang:</h3>
            <input type="text" id="login-input" placeholder="Contoh: Asep" autocomplete="off">
            <button id="login-btn">Lebet Chat</button>
        </div>

        <div id="sidebar">
            <div class="sidebar-header">Kontak Aktip</div>
            <ul id="user-list">
                </ul>
        </div>

        <div id="main-chat">
            <div class="header" id="chat-target-title">💬 Kirim ka: Sadaya Jalma (Broadcast)</div>
            <ul id="messages"></ul>
            
            <form id="form" action="">
                <input id="input" autocomplete="off" placeholder="Ketik pesen di dieu..." /><button>▶</button>
            </form>
        </div>
    </div>

    <audio id="notifSound" src="notif.mp3" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io("https://obrolan-production.up.railway.app");

        let myId = "Anonim";
        let targetChat = "Semua"; // Standar kirim ka sadayana

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const notifSound = document.getElementById('notifSound');
        const userList = document.getElementById('user-list');
        const chatTargetTitle = document.getElementById('chat-target-title');
        
        const loginArea = document.getElementById('login-area');
        const loginInput = document.getElementById('login-input');
        const loginBtn = document.getElementById('login-btn');

        loginBtn.addEventListener('click', function() {
            if(loginInput.value.trim() !== "") {
                myId = loginInput.value.trim();
                loginArea.style.display = 'none';
                socket.emit('user login', myId); // Béjaan server yén urang login
            } else {
                alert("Nami teu kenging kosong nya, Kang!");
            }
        });

        // Nampi daptar pangguna anyar ti server
        socket.on('update user list', function(users) {
            userList.innerHTML = '<li onclick="selectTarget(\'Semua\')" id="target-Semua" class="active-chat">📢 Sadaya Jalma</li>';
            users.forEach(user => {
                if(user !== myId) { // Ulah nembongkeun nami sorangan dina kontak
                    userList.innerHTML += `<li onclick="selectTarget('${user}')" id="target-${user}">👤 ${user}</li>`;
                }
            });
        });

        // Fungsi nalika urang ngaklik salah sahiji nami dina kontak
        function selectTarget(user) {
            targetChat = user;
            document.querySelectorAll('#user-list li').forEach(li => li.classList.remove('active-chat'));
            document.getElementById(`target-${user}`).classList.add('active-chat');
            chatTargetTitle.innerText = user === 'Semua' ? "💬 Kirim ka: Sadaya Jalma (Broadcast)" : `💬 Kirim ka: ${user}`;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value) {
                const data = { id: myId, target: targetChat, message: input.value };
                socket.emit('chat message', data);
                input.value = '';
            }
        });

        socket.on('chat message', function(data) {
            // Pesen dipidangkeun upami di-broadcast (Semua) ATAWA dikirim khusus ka urang ATAWA dikirim ku urang sorangan
            if (data.target === 'Semua' || data.target === myId || data.id === myId) {
                const item = document.createElement('li');
                
                if (data.id === myId) {
                    item.className = 'my-message';
                    let labelTujuan = data.target !== 'Semua' ? `<div style="font-size:10px; color:#aaa; margin-bottom:2px;">Bisik-bisik ka ${data.target}</div>` : '';
                    item.innerHTML = `${labelTujuan}<div>${data.message}</div>`;
                } else {
                    item.className = 'other-message';
                    let labelJenis = data.target !== 'Semua' ? ' (Bisik-bisik)' : '';
                    item.innerHTML = `<div class="sender-id">${data.id}${labelJenis}</div><div>${data.message}</div>`;
                    notifSound.play().catch(err => console.log("Sora aktip"));
                }
                
                messages.appendChild(item);
                messages.scrollTop = messages.scrollHeight;
            }
        });
    </script>
</body>
</html>
